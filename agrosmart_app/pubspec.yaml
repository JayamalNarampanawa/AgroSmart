name: agrosmart_app
description: AgroSmart - Smart Farming Dashboard Mobile App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.1
  firebase_database: ^10.4.9
  firebase_auth: ^4.17.9

  # State Management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.68.0

  # Local Notifications
  flutter_local_notifications: ^17.1.2

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  font_awesome_flutter: ^10.7.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
